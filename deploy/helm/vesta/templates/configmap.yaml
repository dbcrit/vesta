{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- $cfg := deepCopy .Values.agent.config }}
{{- $_ := set $cfg "handlers" (list .Values.runtimeClass.handler) }}
{{- /* Loopback unless exposed; an exposed agent gets --metrics-addr=<node IP> (daemonset.yaml). */}}
{{- $_ := set $cfg "metricsAddr" (printf "127.0.0.1:%d" (int .Values.metrics.port)) }}
{{- if eq .Values.policies.source "kubernetes" }}
{{- if .Values.staticPolicies }}
{{- fail "staticPolicies is only used with policies.source static" }}
{{- end }}
{{- $_ := set $cfg "policySource" "kubernetes" }}
{{- $_ := set $cfg "policySyncTimeout" .Values.policies.syncTimeout }}
{{- else if .Values.staticPolicies }}
{{- $_ := set $cfg "policySource" "file" }}
{{- $_ := set $cfg "policyFile" "/etc/vesta/policies/policies.yaml" }}
{{- $_ := set $cfg "policyReloadInterval" .Values.policies.reloadInterval }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vesta.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vesta.labels" . | nindent 4 }}
data:
  agent.yaml: |
    {{- toYaml $cfg | nindent 4 }}
{{- if .Values.agent.seccomp.installProfile }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vesta.fullname" . }}-seccomp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vesta.labels" . | nindent 4 }}
data:
  {{- (.Files.Glob "files/seccomp/vesta-agent-*.json").AsConfig | nindent 2 }}
{{- end }}
