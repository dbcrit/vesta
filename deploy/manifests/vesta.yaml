metadata:
  name: kata-qemu-vesta
  labels:
    helm.sh/chart: vesta-0.1.0-dev
    app.kubernetes.io/name: vesta
    app.kubernetes.io/instance: vesta
    app.kubernetes.io/version: "0.1.0-dev"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: vesta
handler: kata-qemu-vesta
overhead:
  podFixed:
    cpu: 250m
    memory: 352Mi
scheduling:
  nodeSelector:
    vesta.dev/guest-ready: "0.1.0-dev"
