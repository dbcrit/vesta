apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vesta-agent
  namespace: vesta-system
  labels:
    helm.sh/chart: vesta-0.1.0-dev
    app.kubernetes.io/name: vesta
    app.kubernetes.io/instance: vesta
    app.kubernetes.io/version: "0.1.0-dev"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: vesta
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vesta
      app.kubernetes.io/instance: vesta
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vesta
        app.kubernetes.io/instance: vesta
        app.kubernetes.io/component: agent
      annotations:
        checksum/config: 365d2b5b062ad2c870d2e735f3748d47df2e52ccc69a0308d7b281b95277e4c9
    spec:
      serviceAccountName: vesta
      # Tokens are projected only into the containers that need them: the
      # installer, and the agent with policies.source kubernetes.
      automountServiceAccountToken: false
      # Host AF_VSOCK is not confirmed to be network-namespace aware, so the
      # agent dials guests from the host network namespace.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/os: linux
        katacontainers.io/kata-runtime: "true"
      securityContext:
        # All containers run as uid 0 with every capability dropped. The node
        # paths they use (NRI socket, shim sockets, /opt/vesta, containerd
        # config, systemd private socket, kubelet seccomp dir) are root-owned
        # and root-only; uid 0 owns them, so no CAP_DAC_OVERRIDE is needed.
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seccomp-profile
          image: docker.io/library/busybox@sha256:5cec3fc171c87218698e85a52af7087de727372aae264a787b8112901a5b0092
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -euc
            - |
              case "$(uname -m)" in
                x86_64) arch=amd64 ;;
                aarch64) arch=arm64 ;;
                *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
              esac
              cp "/profiles/vesta-agent-${arch}.json" /seccomp/.vesta-agent.json.tmp
              mv -f /seccomp/.vesta-agent.json.tmp /seccomp/vesta-agent.json
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: seccomp-profiles
              mountPath: /profiles
              readOnly: true
            - name: kubelet-seccomp
              mountPath: /seccomp
        - name: vesta-install
          image: ghcr.io/dbcrit/vesta-install:0.1.0-dev
          imagePullPolicy: IfNotPresent
          args:
            - install
            - --guest-version=0.1.0-dev
            - --nri-default-validator=true
            - --host-root=/host
            - --handler=kata-qemu-vesta
            - --kata-prefix=/opt/kata
            - --restart=systemd
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Only the host paths vesta-install reads or writes, under its
            # --host-root.
            - name: vesta-root
              mountPath: /host/opt/vesta
            - name: kata-root
              mountPath: /host/opt/kata
              readOnly: true
            - name: containerd-config
              mountPath: /host/etc/containerd
            - name: systemd-private
              mountPath: /host/run/systemd/private
            - name: installer-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: vesta-agent
          image: ghcr.io/dbcrit/vesta-agent:0.1.0-dev
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/vesta/agent.yaml
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 9464
              protocol: TCP
          # The kubelet probes from the host network namespace, so loopback works.
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: metrics
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /readyz
              port: metrics
            periodSeconds: 10
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              localhostProfile: vesta/vesta-agent.json
              type: Localhost
          volumeMounts:
            # Unix sockets can be connected to through read-only mounts.
            - name: nri
              mountPath: /var/run/nri
              readOnly: true
            - name: kata-rs-sandboxes
              mountPath: /run/kata
              readOnly: true
            - name: kata-go-sandboxes
              mountPath: /run/vc/sbs
              readOnly: true
            - name: config
              mountPath: /etc/vesta/agent.yaml
              subPath: agent.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: vesta-root
          hostPath:
            path: /opt/vesta
            type: DirectoryOrCreate
        - name: kata-root
          hostPath:
            path: /opt/kata
            type: Directory
        - name: containerd-config
          hostPath:
            path: /etc/containerd
            type: Directory
        - name: systemd-private
          hostPath:
            path: /run/systemd/private
            type: Socket
        - name: installer-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: seccomp-profiles
          configMap:
            name: vesta-seccomp
        - name: kubelet-seccomp
          hostPath:
            path: /var/lib/kubelet/seccomp/vesta
            type: DirectoryOrCreate
        - name: nri
          hostPath:
            path: /var/run/nri
            type: DirectoryOrCreate
        - name: kata-rs-sandboxes
          hostPath:
            path: /run/kata
            type: DirectoryOrCreate
        - name: kata-go-sandboxes
          hostPath:
            path: /run/vc/sbs
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: vesta-agent
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
