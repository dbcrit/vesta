# SPDX-License-Identifier: Apache-2.0
# Every job calls the same make targets developers run locally; toolchains
# come from digest-pinned containers, so the runner only needs Docker.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (fmt, vet, lint, test -race, govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make go-lint
      - run: make go-test
      - run: make go-vulncheck
      - run: make agent

  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make rust-lint
      - run: make rust-test
      # Needs --privileged Docker; P2 checks are skipped where the runner
      # kernel does not have the bpf LSM active.
      - run: make bpf-smoke

  bpf:
    name: bpf (build, ABI check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make abi-check
      - run: make bpf

  guestd:
    name: guestd (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          # Hosted arm64 runners exist only for public repositories; a private
          # repository builds aarch64 under QEMU emulation on x86_64 (slower).
          - arch: aarch64
            runner: ${{ github.event.repository.private && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.runner == 'ubuntu-24.04' && matrix.arch == 'aarch64'
        with:
          platforms: arm64
      # The binary must be static (it runs in any guest rootfs).
      - run: make guestd ARCH=${{ matrix.arch }}
      - run: file images/guest/out/guestd/${{ matrix.arch }}/vesta-guestd | tee /dev/stderr | grep -q 'static'

  bpf-vm:
    name: BPF on guest kernels (vesta 6.18, Debian 6.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Give the runner user access to KVM
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
      # Same cache as the e2e workflow.
      - name: Restore guest kernel
        id: kernel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: images/guest/out/kernel/x86_64
          key: guest-kernel-x86_64-${{ hashFiles('images/guest/versions.env', 'images/guest/kernel/**', 'images/guest/lib.sh') }}
      - name: Build guest kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        run: make guest-kernel
      - name: Save guest kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: images/guest/out/kernel/x86_64
          key: ${{ steps.kernel.outputs.cache-primary-key }}
      - run: make bpf-vm
      - run: make bpf-vm-6.1

  generated:
    name: generated code is current (proto, seccomp, manifests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The seccomp generator runs its arm64 build under emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - run: make proto-check
      - run: make seccomp-check
      - name: regenerate and diff
        run: |
          make proto seccomp helm
          git diff --exit-code

  helm:
    name: helm (lint, kubeconform)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make helm-check
      # Needs --privileged Docker (k3s in a container).
      - run: make crd-check

  scripts:
    name: shellcheck, hadolint, actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make script-lint

  guest-kernel-config:
    name: guest kernel fragment applies (Kata build-kernel.sh setup)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make guest-kernel-config

  image-agent:
    name: vesta-agent image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: make image-agent
