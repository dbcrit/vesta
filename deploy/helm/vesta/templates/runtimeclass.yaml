{{- if .Values.runtimeClass.create }}
# Pods opt in with runtimeClassName. Scheduling is limited to nodes where
# vesta-install has installed this guest version.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.runtimeClass.name }}
  labels:
    {{- include "vesta.labels" . | nindent 4 }}
handler: {{ .Values.runtimeClass.handler }}
{{- with .Values.runtimeClass.overhead }}
overhead:
  {{- toYaml . | nindent 2 }}
{{- end }}
scheduling:
  nodeSelector:
    vesta.dev/guest-ready: {{ include "vesta.guestVersion" . | quote }}
  {{- with .Values.runtimeClass.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
