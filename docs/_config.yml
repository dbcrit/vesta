# SPDX-License-Identifier: Apache-2.0
# Jekyll configuration for the vesta documentation site.
# GitHub Pages builds this site from the /docs folder on main.
# Local preview: see "Preview the docs locally" in index.md.

title: vesta
description: >-
  eBPF security monitoring and enforcement inside Kata Containers guest
  kernels. Documentation of the current implementation (pre-release, Phase 0/1).

# GitHub Pages sets url and baseurl for a project site automatically
# (jekyll-github-metadata). Set baseurl here only for a custom setup.

remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag

# Source repository. Placeholder module path; change it here when the
# repository moves. Pages link to source files as
# {{ site.vesta_repo_url }}/blob/main/<path>.
vesta_repo_url: https://github.com/dbcrit/vesta

# Rewrite links between .md files to the generated pages.
relative_links:
  enabled: true
  collections: false

aux_links:
  "vesta on GitHub":
    - "https://github.com/dbcrit/vesta"
aux_links_new_tab: true

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Mermaid diagrams in ```mermaid fences. Pinned version from jsDelivr.
mermaid:
  version: "11.17.2"

heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  vesta is licensed under Apache-2.0 (userspace) and GPL-2.0-only OR
  BSD-2-Clause (BPF programs). This site documents a pre-release that has
  not yet run end to end in a Kata VM; see the Status page.

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/dbcrit/vesta"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

# Callouts: {: .note } and {: .warning } after a paragraph.
callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red
  important:
    title: Important
    color: yellow

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
