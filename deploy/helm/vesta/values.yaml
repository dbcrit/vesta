# SPDX-License-Identifier: Apache-2.0
# Default values for the vesta chart. See README.md for the privilege rationale.

# Guest runtime version installed by vesta-install. It is the directory name
# under /opt/vesta/kata/ and the value of the vesta.dev/guest-ready node label
# the RuntimeClass selects on. Defaults to the chart appVersion; it must match
# the VERSION file baked into the vesta-install image. Semver without build
# metadata.
guestVersion: ""

imagePullSecrets: []

agent:
  image:
    repository: ghcr.io/dbcrit/vesta-agent
    # Defaults to the chart appVersion. A digest, if set, takes precedence.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  # Settings written to the agent config file (strict: unknown keys are
  # rejected by vesta-agent). Keys: see host/internal/agentconfig.
  config:
    logLevel: info
    # Open or Closed, for containers no policy selects.
    defaultFailurePolicy: Open
    # Kill switch: Normal, AuditOnly or Detached.
    globalMode: Normal
    # Must stay below containerd's 2s NRI plugin request timeout.
    gateTimeout: 1500ms
  # containerd's RuntimeDefault seccomp profile denies socket(AF_VSOCK), which
  # the agent needs to dial guests. The default is a Localhost profile equal to
  # containerd's default plus AF_VSOCK (files/seccomp/, generated by
  # hack/gen-seccomp-profile.sh). With installProfile, an init container copies
  # it to <kubelet.rootDir>/seccomp/vesta/vesta-agent.json.
  seccomp:
    installProfile: true
    profile:
      type: Localhost
      localhostProfile: vesta/vesta-agent.json
  probes:
    enabled: true
  extraArgs: []

installer:
  image:
    repository: ghcr.io/dbcrit/vesta-install
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      # Copying the guest image goes through the page cache, which is charged
      # to the container.
      memory: 256Mi
  # Selects which containerd config directory is mounted; vesta-install
  # detects the layout inside it:
  #   containerd  /etc/containerd (conf.d on containerd >= 2.2, else imports)
  #   k3s / rke2  /var/lib/rancher/<flavor>/agent/etc/containerd (config-v3.toml.d)
  containerdFlavor: containerd
  # Restart containerd (or k3s/rke2) through the host systemd private socket
  # when the runtime registration changed. When false the installer fails
  # with "restart required" and the node is not labelled.
  restartContainerd: true
  extraArgs: []

# Small image used only to copy the agent seccomp profile onto the node.
seccompInstaller:
  image:
    repository: docker.io/library/busybox
    tag: 1.37.0-musl
    digest: sha256:5cec3fc171c87218698e85a52af7087de727372aae264a787b8112901a5b0092
    pullPolicy: IfNotPresent

kata:
  # Node label kata-deploy sets; the DaemonSet runs only on these nodes.
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
  # kata-deploy env.installationPrefix. Mounted read-only.
  installPrefix: /opt/kata

kubelet:
  # Needed for the agent's Localhost seccomp profile.
  rootDir: /var/lib/kubelet

runtimeClass:
  create: true
  name: kata-qemu-vesta
  handler: kata-qemu-vesta
  # kata-deploy uses 320Mi/250m for qemu-runtime-rs; vesta adds vesta-guestd
  # (RSS budget 20 MiB) and resident kernel BTF.
  overhead:
    podFixed:
      memory: 352Mi
      cpu: 250m
  tolerations: []

# Extra tolerations for the DaemonSet (e.g. for tainted Kata node pools).
tolerations: []
affinity: {}
# Optional: system-node-critical keeps the agent from being evicted first.
# Some managed clusters restrict it to kube-system.
priorityClassName: ""
podAnnotations: {}
podLabels: {}
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true
  # ValidatingAdmissionPolicy limiting what this chart's service account may
  # change on Node objects: only the vesta.dev/guest-ready label, and only on
  # the node its pod runs on (bound tokens carry the node name).
  nodeLabelPolicy:
    enabled: true

nri:
  # vesta-install enables containerd's NRI default validator in its drop-in
  # (no globally required plugins, so nothing changes by itself). It makes the
  # pod annotation required-plugins.noderesource.dev/pod: '["vesta"]'
  # effective: such pods cannot create containers while the vesta NRI plugin
  # is not registered (agent down, restarting, or dropped by NRI).
  defaultValidator: true
  # NRI calls only registered plugins, so without that annotation a vesta
  # pod created while vesta-agent is down starts ungated, even under a
  # failurePolicy: Closed policy. When true, a ValidatingAdmissionPolicy
  # rejects pods of runtimeClass.name that do not carry the annotation. The
  # cost: no such pod can start while the agent is down, whatever its policy.
  requirePluginAnnotation: false

# Node cleanup before `helm uninstall` (see README.md "Uninstall"). When true,
# the DaemonSet stops the agent and its init container runs
# `vesta-install uninstall` instead of install; it retries (CrashLoopBackOff)
# while kata-qemu-vesta pods still run on the node. The service account then
# also gets list on pods and runtimeclasses, which uninstall needs.
uninstall:
  enabled: false

# Static VestaPolicy objects (vesta.dev/v1alpha1), written as one multi-document
# file the agent loads with policyFile. Empty: monitor only.
staticPolicies: []

metrics:
  port: 9464
  # /metrics, /healthz and /readyz are unauthenticated. By default they listen
  # on 127.0.0.1 only (the agent uses the host network). exposeOnNodeIP, or
  # enabling the Service or PodMonitor, binds them to the node IP instead:
  # restrict that port with a host firewall or NetworkPolicy for host traffic.
  exposeOnNodeIP: false
  service:
    enabled: false
  podMonitor:
    enabled: false
    interval: 30s
    labels: {}
