# vesta guest kernel fragment for Kata 4.2 (Linux 6.18.35). Installed as
# tools/packaging/kernel/configs/fragments/build-type/vesta/vesta.conf and
# built with `build-kernel.sh -b vesta` (images/guest/kernel/build.sh).
#
# Options Kata's common fragments already set are not repeated here:
#   common/cgroup.conf   BPF_SYSCALL, CGROUP_BPF, CGROUPS, SOCK_CGROUP_DATA
#   common/network.conf  SECURITY, HAVE_EBPF_JIT
#   common/lsm.conf      SECURITY_NETWORK, SECURITY_SELINUX
#   common/landlock.conf SECURITY_LANDLOCK
# MODULES stays off on x86_64/arm64 (Kata never enables it there).
# See docs/compat/kata-4.2.md §4.

# Core BPF
CONFIG_BPF_JIT=y
CONFIG_BPF_JIT_ALWAYS_ON=y
CONFIG_BPF_UNPRIV_DEFAULT_OFF=y

# BTF for CO-RE. Needs pahole >= 1.16 in the builder (Kata's has 1.22+).
# DWARF is stripped from the shipped vmlinux; .BTF stays.
CONFIG_DEBUG_INFO=y
CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=y
CONFIG_DEBUG_INFO_BTF=y

# LSM. bpf must be in the active list; CONFIG_LSM makes it so without an
# lsm= boot param. Order keeps Kata's LSMs (landlock, selinux) and adds
# lockdown (enabled by lockdown=integrity in the vesta runtime config) and yama.
CONFIG_SECURITYFS=y
CONFIG_SECURITY_PATH=y
CONFIG_BPF_LSM=y
CONFIG_SECURITY_LOCKDOWN_LSM=y
CONFIG_SECURITY_YAMA=y
CONFIG_LSM="landlock,lockdown,yama,selinux,bpf"

# Tracing: tracepoint programs (sched_process_exec) and fentry trampolines.
# DYNAMIC_FTRACE depends on FUNCTION_TRACER.
CONFIG_BPF_EVENTS=y
CONFIG_FTRACE=y
CONFIG_FUNCTION_TRACER=y
CONFIG_DYNAMIC_FTRACE=y
CONFIG_FTRACE_SYSCALLS=y
CONFIG_KPROBES=y
CONFIG_KPROBE_EVENTS=y
