# SPDX-License-Identifier: Apache-2.0
# End-to-end tests: single-node k3s + Cilium + Kata Containers (kata-deploy)
# with vesta built from this commit, on a GitHub-hosted Linux runner, which
# exposes /dev/kvm. See test/e2e/README.md.
#
# Slow (guest rootfs build, cluster setup; the guest kernel is cached), so it
# does not run on every push:
#   - manually (Actions tab, or: gh workflow run e2e.yml -f tests="exec_enforce hot_reload")
#   - nightly on the default branch
#   - on pull requests that carry the "run-e2e" label
name: e2e

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Space-separated test names to run (empty: all). See test/e2e/README.md."
        required: false
        default: ""
      runner:
        description: "Runner label. Private repos: consider a larger runner (8+ GB RAM) if you have one."
        required: false
        default: ubuntu-24.04
      k3s_version:
        description: "Override K3S_VERSION (empty: test/e2e/env.sh)"
        required: false
        default: ""
      cilium_version:
        description: "Override CILIUM_VERSION (empty: test/e2e/env.sh)"
        required: false
        default: ""
 # schedule:
 #   - cron: "17 3 * * *"
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  k3s-cilium-kata:
    name: k3s + Cilium + Kata (x86_64)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 180
    env:
      VESTA_VERSION: 0.1.0-e2e
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
      K3S_VERSION_OVERRIDE: ${{ inputs.k3s_version }}
      CILIUM_VERSION_OVERRIDE: ${{ inputs.cilium_version }}
      E2E_TESTS: ${{ inputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply version overrides
        run: |
          [[ -z "${K3S_VERSION_OVERRIDE}" ]] || echo "K3S_VERSION=${K3S_VERSION_OVERRIDE}" >>"${GITHUB_ENV}"
          [[ -z "${CILIUM_VERSION_OVERRIDE}" ]] || echo "CILIUM_VERSION=${CILIUM_VERSION_OVERRIDE}" >>"${GITHUB_ENV}"

      - name: Check KVM and give the runner user access
        run: |
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::/dev/kvm is not available on this runner; Kata cannot run here"
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          nproc
          free -h

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null
          df -h /

      # The guest kernel only changes with the Kata/kernel pins or the vesta
      # fragment; a cache hit saves about 20 minutes.
      - name: Restore guest kernel
        id: kernel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: images/guest/out/kernel/x86_64
          key: guest-kernel-x86_64-${{ hashFiles('images/guest/versions.env', 'images/guest/kernel/**', 'images/guest/lib.sh') }}

      - name: Build vesta (guest kernel, guest rootfs, images)
        env:
          E2E_BUILD_ONLY: "1"
          E2E_REUSE_KERNEL: ${{ steps.kernel.outputs.cache-hit == 'true' && '1' || '' }}
        run: test/e2e/deploy-vesta.sh

      # Saved right after the build, so a later test failure still caches it.
      - name: Save guest kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: images/guest/out/kernel/x86_64
          key: ${{ steps.kernel.outputs.cache-primary-key }}

      - name: Bring up k3s, Cilium and Kata
        run: test/e2e/up.sh

      - name: Deploy vesta
        env:
          E2E_SKIP_BUILD: "1"
        run: test/e2e/deploy-vesta.sh

      - name: Run the e2e tests
        run: |
          # shellcheck disable=SC2086 # word-split the test list on purpose
          test/e2e/test.sh ${E2E_TESTS}

      - name: Collect logs
        if: failure() || cancelled()
        run: test/e2e/collect-logs.sh

      - name: Upload logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7
