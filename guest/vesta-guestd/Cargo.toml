[package]
name = "vesta-guestd"
description = "vesta in-guest daemon: loads the vesta BPF programs and serves the host channel over vsock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
# Vendored libbpf v1.7.0 (default feature) linked statically with the
# system libelf/zlib ("static").
libbpf-rs = { version = "=0.27.2", features = ["static"] }
prost = "0.14.4"
rustix = { version = "1.1.5", features = ["fs", "mount", "param", "process", "system", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-vsock = "0.7.2"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[build-dependencies]
libbpf-cargo = "=0.27.2"
prost-build = "0.14.4"

[dev-dependencies]
tempfile = "3"
# capset for the smoke test's reduced-capability mode.
rustix = { version = "1.1.5", features = ["thread"] }

[lints]
workspace = true
