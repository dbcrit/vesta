# Source: vesta/templates/rbac.yaml
# vesta-install reads its node (containerd version) and sets the
# vesta.dev/guest-ready label. RBAC cannot scope this to one node or one
# label; the ValidatingAdmissionPolicy in node-label-policy.yaml does.
# vesta-agent gets a token only with policies.source kubernetes (below).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vesta-installer
  labels:
    helm.sh/chart: vesta-0.1.0-dev
    app.kubernetes.io/name: vesta
    app.kubernetes.io/instance: vesta
    app.kubernetes.io/version: "0.1.0-dev"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: vesta
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
---
